<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMS – Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.nav{text-decoration:none;cursor:pointer}.page-actions{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.control{min-width:190px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font:500 14px Inter}
.table-wrap{width:100%;overflow-x:auto}table{min-width:760px}td{font-size:14px}
.empty{padding:28px;text-align:center;color:var(--text-muted)}
@media(max-width:900px){.page-actions{width:100%}.page-actions .btn{flex:1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<div class="main-wrap">
<header class="topbar">
<div class="crumb" id="crumb">Workspace / Notifications</div>
<div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="global-search" placeholder="Search notifications."></div>
<button class="icon-btn" aria-label="Notifications" onclick="location.href='notification.html'"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
<button class="icon-btn" aria-label="Profile" onclick="location.href='change-password.html'"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
</header>
<main>
<div class="head"><div><h1 id="page-title">Notifications</h1><p id="page-subtitle">Your notifications are shown below.</p></div><div class="badges" id="role-badges"></div></div>
<div class="page-actions"><button class="btn primary" type="button" id="mark-all">Mark All as Read</button></div>
<section class="card">
<div class="card-h"><h2>Notifications list</h2><span class="badge b-neutral" id="record-count"></span></div>
<div class="toolbar">
<select class="control" id="type-filter"><option value="all">All types</option><option value="Enrollment">Enrollment</option><option value="Session">Session</option><option value="Reminder">Reminder</option><option value="Approval">Approval</option><option value="Training">Training</option><option value="Report">Report</option><option value="System">System</option></select>
<select class="control" id="status-filter"><option value="all">All statuses</option><option value="Unread">Unread</option><option value="Read">Read</option></select>
</div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Type</th><th>Notification</th><th>Details</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="notification-rows"></tbody></table></div>
</section>
</main></div></div>
<div class="toast" id="toast"></div>
<script>
const roleData = {
 employee: {
  label:'Employee', nav:['Dashboard','Program Catalog','My Training','Notification'],
  title:'My Notifications', subtitle:'Updates about your enrollments, sessions, and required training.',
  badges:['Employee view','Personal notifications'],
  items:[
   ['N-01','Enrollment','Enrollment approved','Your enrollment in Financial Reporting Basics was approved.','Today, 09:12','Unread'],
   ['N-02','Session','Upcoming session reminder','Excel for Analysts starts soon. Check your session details.','Yesterday, 16:40','Unread'],
   ['N-03','Training','Mandatory training reminder','Please complete your assigned Workplace Safety training.','24 Nov 2026','Read']
  ]
 },
 trainer: {
  label:'Trainer', nav:['Dashboard','Program Catalog','My Training','My Sessions','Notification'],
  title:'My Notifications', subtitle:'Updates about your assigned sessions, attendance, and results.',
  badges:['Trainer view','Assigned sessions only'],
  items:[
   ['N-11','Session','Session assigned','You were assigned to Excel for Analysts.','Today, 08:30','Unread'],
   ['N-12','Training','Attendance needs recording','Attendance for Financial Reporting Basics needs to be recorded.','Yesterday, 17:05','Unread'],
   ['N-13','Approval','Results status updated','Your submitted session results are ready for review.','24 Nov 2026','Read']
  ]
 },
 manager: {
  label:'Department Manager', nav:['Dashboard','Team dashboard','Department employees','Employee records','Department reports','Attendance','Training suggestions','Program catalog','Notifications'],
  title:'Team Notifications', subtitle:'Updates about your department’s training nominations and team requirements.',
  badges:['Department Manager','Department notifications only'],
  items:[
   ['N-21','Approval','Nomination awaiting review','Nomination for Omar Farouk is awaiting L&D review.','Today, 09:12','Unread'],
   ['N-22','Training','Mandatory training deadline','Mandatory training deadline is in 5 days for 3 employees.','Yesterday, 14:20','Unread'],
   ['N-23','Enrollment','Team enrollment update','A team member’s training enrollment status has changed.','24 Nov 2026','Read']
  ]
 },
 management: {
  label:'Management', nav:['Dashboard','Reports','Notification'],
  title:'Management Notifications', subtitle:'High-level updates and report alerts across departments.',
  badges:['Management view','Summary only'],
  items:[
   ['N-31','Report','Monthly training report ready','The monthly training report is ready to export.','Today, 09:00','Unread'],
   ['N-32','System','Seat utilization update','Seat utilization crossed 80% this month.','Yesterday, 14:20','Unread']
  ]
 },
 ld: {
  label:'L&D Administrator', nav:['Dashboard','Users','Program Catalog','Sessions','Enrollment Requests','Direct Enrollment','Results','Employee History','Reports','Audit and Security Log','System Settings','Notification','Approvals','Training plan','Access and HR review'],
  title:'Notifications', subtitle:'Unread notifications are marked. Select an item to open its related screen.',
  badges:['Full access','L&D Administrator'],
  items:[
   ['N-24','Training','Mandatory training overdue','3 employees are 14 days overdue.','Today, 09:12','Unread'],
   ['N-25','Approval','Sensitive action needs approval','A role change is waiting for your approval.','Today, 08:40','Unread'],
   ['N-27','Report','Budget at 90%','Annual training spend reached 90%.','Yesterday, 14:20','Read'],
   ['N-28','System','Attendance dispute received','Amira disputed attendance for 12 Nov.','Yesterday, 11:05','Read']
  ]
 }
};
const paths={'Dashboard':'dashboard.html','Users':'users.html','Program Catalog':'program-catalog.html','Sessions':'sessions.html','Enrollment Requests':'enrollment-requests.html','Direct Enrollment':'direct-enrollment.html','Results':'results.html','Employee History':'employee-history.html','Reports':'reports.html','Audit and Security Log':'audit-security-log.html','System Settings':'system-settings.html','Notification':'notification.html','Notifications':'notification.html','Approvals':'approvals.html','Training plan':'training-plan.html','Access and HR review':'access-hr-review.html'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='employee';
try{role=sessionStorage.getItem('tms.role')||'employee'}catch(e){}
if(!roleData[role]) role='employee';
if(role==='employee'){location.replace('employee-notifications.html');}
const data=roleData[role];
const logo=`<div class="logo"><img src="assets/logo-white.png" alt="RMO" onerror="this.parentNode.innerHTML='<div><div class=wm>RMO</div><small>RIDGELINE MOUNTAIN OUTFITTERS</small></div>'"></div>`;
document.getElementById('sidebar').innerHTML=logo+`<div class="role">${esc(data.label)}</div><div></div>`+
 data.nav.map((n,i)=>`<a class="nav${n==='Notification'||n==='Notifications'?' active':''}" href="${paths[n]||'#'}">${esc(n)}</a>`).join('')+
 `<div class="spacer"></div><a class="nav muted" href="change-password.html">Change password</a><a class="nav muted" href="index.html" id="logout">Log out</a>`;
document.getElementById('page-title').textContent=data.title;
document.getElementById('page-subtitle').textContent=data.subtitle;
document.getElementById('crumb').textContent='Workspace / '+data.title;
document.getElementById('role-badges').innerHTML=data.badges.map((b,i)=>`<span class="badge ${i?'b-neutral':'b-info'}">${esc(b)}</span>`).join('');
document.title='TMS – '+data.title;
let items=data.items.map(x=>[...x]);
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(window._notificationToast);window._notificationToast=setTimeout(()=>t.classList.remove('show'),1800)}
function renderRows(){
 const type=document.getElementById('type-filter').value,status=document.getElementById('status-filter').value,q=document.getElementById('global-search').value.toLowerCase();
 const shown=items.filter(x=>(type==='all'||x[1]===type)&&(status==='all'||x[5]===status)&&x.join(' ').toLowerCase().includes(q));
 document.getElementById('record-count').textContent=shown.length+' records';
 document.getElementById('notification-rows').innerHTML=shown.length?shown.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td><td>${x[5]==='Unread'?'<span class="badge b-warning">Unread</span>':'<span class="badge b-neutral">Read</span>'}</td><td><button class="btn outline row-action" data-id="${esc(x[0])}">${x[5]==='Unread'?'Mark read':'Open'}</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No notifications match your filters.</td></tr>';
}
renderRows();
document.getElementById('type-filter').addEventListener('change',renderRows);
document.getElementById('status-filter').addEventListener('change',renderRows);
document.getElementById('global-search').addEventListener('input',renderRows);
document.getElementById('notification-rows').addEventListener('click',e=>{
 const b=e.target.closest('[data-id]');if(!b)return;
 const item=items.find(x=>x[0]===b.dataset.id);if(item){item[5]='Read';renderRows();toast('Notification marked as read');}
});
document.getElementById('mark-all').addEventListener('click',()=>{
 items.forEach(x=>x[5]='Read');renderRows();toast('All notifications marked as read');
});
document.getElementById('logout').addEventListener('click',()=>{try{sessionStorage.clear()}catch(e){}});
</script>
</body>
</html>
