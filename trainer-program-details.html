<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMS – Program Details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/trainer.css">
<style>
  .tpd-wrap { max-width:1280px; }
  .tpd-hero { background:#e1e3de; border-radius:8px; padding:28px 32px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:start; margin-bottom:24px; box-shadow:0 2px 6px rgba(37,41,37,.15); }
  .tpd-hero .tag { display:inline-block; background:var(--brand); color:#fff; font:600 12px Inter; letter-spacing:.6px; padding:6px 14px; border-radius:4px; text-transform:uppercase; }
  .tpd-hero h1 { font:700 40px/1.15 "Source Sans 3",Inter; color:var(--brand-dark); margin:14px 0 20px; }
  .tpd-hero .facts { display:flex; gap:40px; }
  .tpd-hero .facts div span { display:block; font:400 13px Inter; color:var(--text-2); }
  .tpd-hero .facts div b { display:block; font:600 18px Inter; color:var(--text); margin-top:4px; }
  .tpd-hero .cta { background:var(--brand); color:#fff; border:0; border-radius:4px; padding:16px 32px; font:600 16px "Source Sans 3",Inter; cursor:pointer; min-width:280px; margin-top:20px; }
  .tpd-hero .cta:hover { background:var(--brand-dark); }

  .tpd-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:24px; align-items:start; }
  .tpd-left { display:flex; flex-direction:column; gap:20px; }
  .tpd-card { background:#e1e3de; border-radius:8px; padding:24px; box-shadow:0 2px 6px rgba(37,41,37,.15); }
  .tpd-card h2 { font:700 24px/1.3 "Source Sans 3",Inter; color:var(--brand-dark); margin:0 0 12px; }
  .tpd-card p { font:400 15px/1.55 Inter; color:var(--text); margin:0; }
  .tpd-card ul { list-style:none; display:flex; flex-direction:column; gap:10px; margin:0; padding:0; }
  .tpd-card ul li { position:relative; padding-left:22px; font:400 15px/1.5 Inter; color:var(--text); }
  .tpd-card ul li::before { content:""; position:absolute; left:0; top:9px; width:8px; height:8px; border-radius:50%; background:var(--brand-dark); }
  .tpd-two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .tpd-pill { display:inline-block; background:#fff; border-radius:4px; padding:4px 12px; font:500 13px Inter; color:var(--text); margin-top:8px; }

  .tpd-sessions { background:#e1e3de; border-radius:8px; padding:24px; box-shadow:0 2px 6px rgba(37,41,37,.15); display:flex; flex-direction:column; gap:16px; }
  .tpd-sessions h2 { font:700 24px/1.3 "Source Sans 3",Inter; color:var(--brand-dark); margin:0 0 6px; }
  .tpd-sess { background:#fff; border:1px solid var(--brand); border-radius:8px; padding:18px 20px; display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:end; }
  .tpd-sess .when { grid-column:1/-1; font:600 16px Inter; color:var(--text); }
  .tpd-sess .meta { grid-column:1/-1; font:400 13px Inter; color:var(--text-2); margin-bottom:6px; }
  .tpd-sess .bar { grid-column:1/-1; height:8px; border-radius:4px; background:#e1e3de; overflow:hidden; margin-bottom:6px; }
  .tpd-sess .bar i { display:block; height:100%; border-radius:4px; background:var(--brand-dark); }
  .tpd-sess.full .bar i { background:#a80000; }
  .tpd-sess .cap { font:500 13px Inter; color:var(--brand-dark); }
  .tpd-sess.full .cap { color:#a80000; }
  .tpd-sess .st { font:600 12px Inter; padding:4px 18px; border-radius:4px; background:var(--success-bg); color:var(--brand); }
  .tpd-sess.full .st { background:var(--danger-bg); color:#a12f2f; }
  .tpd-sessions .cta-wide { width:100%; background:var(--brand); color:#fff; border:0; border-radius:4px; padding:14px; font:600 15px "Source Sans 3",Inter; cursor:pointer; }
  .tpd-sessions .cta-wide:hover { background:var(--brand-dark); }

  @media(max-width:1000px){ .tpd-grid{ grid-template-columns:1fr; } .tpd-hero{ grid-template-columns:1fr; } .tpd-hero .cta{ width:100%; min-width:0; } .tpd-two{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar">
      <div class="crumb">Workspace / User List & Search</div>
      <div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search..."></div>
      <button class="icon-btn" id="top-notifications" type="button" aria-label="Notifications">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      </button>
      <button class="icon-btn" id="top-profile" type="button" aria-label="Change password">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </button>
    </header>
    <main class="trainer-main">
      <div class="tpd-wrap" id="tpd"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/trainer-shared.js"></script>
<script>
(function(){
  TrainerUI.init('Program Catalog');

  const catalog = {
    'Trail Safety Fundamentals': {
      tag:'SAFETY', title:'Trail Safety Fundamentals',
      facts:[['Duration','12 hours'],['Mode','In-person'],['Audience','All outdoor guides']],
      about:'Learn the core skills for staying safe on remote trails, from risk assessment to emergency response, with hands-on practice.',
      objectives:['Assess trail and weather risks','Apply first-aid basics in the field','Plan and communicate an emergency response'],
      prereq:'Program X', prereqStatus:'Completed',
      criteria:['Min attendance: 80%','Passing score: 70'],
      sessions:[
        { when:'14 Nov · 09:00–17:00', meta:'In-person · Sam Carter', pct:100, cap:'Full · Waitlist 3', status:'Full', full:true },
        { when:'02 Dec · 09:00–17:00', meta:'Online · Lena Ortiz', pct:60, cap:'12 seats left of 20', status:'Open', full:false }
      ]
    },
    'Gear Care & Maintenance': {
      tag:'GEAR', title:'Gear Care & Maintenance',
      facts:[['Duration','3 hours'],['Mode','Online'],['Audience','All employees']],
      about:'Practical guidance for caring for equipment and extending its useful life.',
      objectives:['Inspect equipment before and after use','Apply cleaning and storage best practices','Identify when gear needs replacement'],
      prereq:'None', prereqStatus:'',
      criteria:['Attendance: 100%'],
      sessions:[]
    },
    'Backcountry Navigation': {
      tag:'NAVIGATION', title:'Backcountry Navigation',
      facts:[['Duration','3 days'],['Mode','Hybrid'],['Audience','Outdoor guides']],
      about:'Build navigation skills for remote environments using maps, compass and route planning.',
      objectives:['Read topographic maps','Use compass bearings','Plan routes with waypoints'],
      prereq:'Trail Safety Fundamentals', prereqStatus:'Completed',
      criteria:['Min attendance: 80%','Field assessment: pass'],
      sessions:[
        { when:'05 Nov · 08:00–16:00', meta:'Field training · Sam Carter', pct:70, cap:'6 seats left of 20', status:'Open', full:false }
      ]
    }
  };

  const key = sessionStorage.getItem('tms.trainer.program') || 'Trail Safety Fundamentals';
  const p = catalog[key] || catalog['Trail Safety Fundamentals'];
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function render(){
    document.getElementById('tpd').innerHTML = `
      <section class="tpd-hero">
        <div>
          <span class="tag">${esc(p.tag)}</span>
          <h1>${esc(p.title)}</h1>
          <div class="facts">${p.facts.map(f=>`<div><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div>
        </div>
        <button class="cta" id="cta-hero" type="button">Request Enrollment</button>
      </section>
      <div class="tpd-grid">
        <div class="tpd-left">
          <section class="tpd-card"><h2>About this program</h2><p>${esc(p.about)}</p></section>
          <section class="tpd-card"><h2>Learning objectives</h2><ul>${p.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section>
          <div class="tpd-two">
            <section class="tpd-card"><h2>Prerequisites</h2><ul><li>${esc(p.prereq)}</li></ul>${p.prereqStatus?`<span class="tpd-pill">${esc(p.prereqStatus)}</span>`:''}</section>
            <section class="tpd-card"><h2>Completion criteria</h2><ul>${p.criteria.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
          </div>
        </div>
        <section class="tpd-sessions">
          <h2>Upcoming sessions</h2>
          ${p.sessions.length === 0 ? '<p style="font:400 14px Inter;color:var(--text-2)">No upcoming sessions for this program.</p>' : p.sessions.map(s=>`
            <div class="tpd-sess ${s.full?'full':''}">
              <span class="when">${esc(s.when)}</span>
              <span class="meta">${esc(s.meta)}</span>
              <span class="bar"><i style="width:${s.pct}%"></i></span>
              <span class="cap">${esc(s.cap)}</span>
              <span class="st">${esc(s.status)}</span>
            </div>
          `).join('')}
          <button class="cta-wide" id="cta-wide" type="button">Request Enrollment</button>
        </section>
      </div>
    `;
    const fullState = p.sessions.some(s => s.full);
    const target = 'trainer-request-enrollment.html?state=' + (fullState ? 'waitlist' : 'ready');
    document.getElementById('cta-hero').addEventListener('click', () => location.href=target);
    const w = document.getElementById('cta-wide'); if (w) w.addEventListener('click', () => location.href=target);
  }

  render();

  const tn = document.getElementById('top-notifications');
  if (tn) tn.addEventListener('click', () => location.href='trainer-notifications.html');
  const tp = document.getElementById('top-profile');
  if (tp) tp.addEventListener('click', () => location.href='change-password.html');
})();
</script>
</body>
</html>
