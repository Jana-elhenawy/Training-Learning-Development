<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMS – Change password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar">
      <div class="crumb">Workspace / Change password</div>
      <div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search…"></div>
      <button class="icon-btn" aria-label="Notifications"><svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
      <button class="icon-btn" aria-label="Profile"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </header>
    <form class="cp" id="cp" novalidate>
      <h1>Change Password</h1>
      <label for="cur">Current Password</label><input id="cur" type="password" placeholder="Current password" autocomplete="current-password">
      <label for="np">New Password</label><input id="np" type="password" placeholder="New password" autocomplete="new-password">
      <label for="cf">Confirm New Password</label><input id="cf" type="password" placeholder="Confirm new password" autocomplete="new-password">
      <div class="policy"><b>Password policy</b>• At least 8 characters; uppercase, lowercase and a digit<br>• Not your username; not one of your last 3 passwords</div>
      <div class="msg-error" id="err" role="alert"></div>
      <div class="btns"><button class="pill primary" type="submit">Change Password</button><button class="pill sand" type="button" id="cancel">Cancel</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/shell.js"></script>
<script>
buildSidebar('Change password');
const back=()=>location.href='dashboard.html';
document.getElementById('cancel').onclick=back;
document.getElementById('cp').addEventListener('submit',e=>{
  e.preventDefault();
  const c=cur.value,p=np.value,f=cf.value,err=document.getElementById('err');let m='';
  let u='';try{u=(sessionStorage.getItem('tms.user')||'').toLowerCase()}catch(_){}
  if(!c)m='Enter your current password.';
  else if(p.length<8||!/[A-Z]/.test(p)||!/[a-z]/.test(p)||!/\d/.test(p))m='New password does not meet the policy.';
  else if(u&&p.toLowerCase()===u)m='New password cannot be your username.';
  else if(p!==f)m='Passwords do not match.';
  err.textContent=m;err.classList.toggle('show',!!m);
  if(!m){const t=document.getElementById('toast');t.textContent='Password changed';t.classList.add('show');setTimeout(back,1200)}
});
</script>
</body>
</html>
